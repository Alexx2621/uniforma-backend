# Despliegue automatico a cPanel al hacer push a main.
#
# El servidor NO puede compilar: 'prisma generate' usa un motor WebAssembly que
# su contenedor no consigue instanciar, y 'nest build' necesita las
# dependencias de desarrollo, que no se instalan en modo produccion. Por eso
# todo se construye aqui y se sube ya compilado.
#
# La transferencia va por SFTP y no por rsync porque el hosting tiene el shell
# deshabilitado: solo permite transferencia de archivos.
name: Desplegar a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVIDOR: 192.250.227.20
  USUARIO: unirfoma
  RAIZ: /home/unirfoma/uniforma-api

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        # generate no se conecta a la base; la URL solo satisface al esquema.
        env:
          DATABASE_URL: mysql://u:p@localhost:3306/d
        run: npx prisma generate

      - name: Compilar
        run: npm run build

      - name: Preparar acceso SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          ssh-keyscan -H "$SERVIDOR" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Detectar cambios en el esquema
        id: esquema
        run: |
          # Si no hay commit anterior con el que comparar, se sube por si acaso.
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD | grep -q '^prisma/schema.prisma$'; then
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          else
            echo "cambio=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar si cambiaron las dependencias
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -q '^package.json$'; then
            echo "::warning::package.json cambio. El servidor conserva su propia version (alias de puppeteer, postinstall adaptado), asi que las dependencias nuevas NO se instalan solas: hay que ejecutar 'Ejecutar NPM Install' en cPanel."
          fi

      - name: Subir compilado
        run: |
          sftp -i ~/.ssh/id_despliegue -o BatchMode=yes "$USUARIO@$SERVIDOR" <<EOF
          cd $RAIZ
          put -r dist
          put -r prisma
          put -r scripts
          quit
          EOF

      - name: Subir cliente de Prisma
        if: steps.esquema.outputs.cambio == 'si'
        # Solo cuando cambia el esquema: el motor de Linux pesa 21 MB y no tiene
        # sentido reenviarlo en cada despliegue.
        run: |
          cd node_modules/.prisma/client
          rm -f *.tmp* query_engine-windows.dll.node libquery_engine-debian-openssl-1.1.x.so.node
          sftp -i ~/.ssh/id_despliegue -o BatchMode=yes "$USUARIO@$SERVIDOR" <<EOF
          cd $RAIZ/node_modules/.prisma/client
          put *
          quit
          EOF

      - name: Reiniciar la aplicacion
        # Passenger recarga al tocar tmp/restart.txt.
        run: |
          date > restart.txt
          sftp -i ~/.ssh/id_despliegue -o BatchMode=yes "$USUARIO@$SERVIDOR" <<EOF
          cd $RAIZ/tmp
          put restart.txt
          quit
          EOF

      # La verificacion se hace por SSH desde el propio servidor. Desde fuera
      # no sirve: el hosting responde a las IP de GitHub con una pagina
      # anti-bots que devuelve HTTP 200, indistinguible de una respuesta real
      # si uno solo mira el codigo. Preguntando en 127.0.0.1 se habla con la
      # aplicacion directamente, sin ese filtro en medio.
      - name: Comprobar que responde
        run: |
          SSH="ssh -i $HOME/.ssh/id_despliegue -o BatchMode=yes -o ConnectTimeout=15 $USUARIO@$SERVIDOR"
          hay_ssh=0
          if $SSH "echo listo" 2>/dev/null | grep -q listo; then
            hay_ssh=1
          else
            echo "Sin ejecucion remota por SSH; se verificara desde fuera."
          fi
          reto=0
          for i in $(seq 1 20); do
            if [ "$hay_ssh" = "1" ]; then
              dentro=$($SSH "curl -s -m 15 -H 'Host: api.uniformaguatemala.com' http://127.0.0.1/status" 2>/dev/null || true)
              if printf %s "$dentro" | grep -q '"status":"online"'; then
                echo "intento $i -> la aplicacion respondio desde dentro del servidor."
                exit 0
              fi
            fi
            codigo=$(curl -s --max-time 20 -o respuesta.txt -w %{http_code} https://api.uniformaguatemala.com/status || true)
            if grep -q '"status":"online"' respuesta.txt 2>/dev/null; then
              echo "intento $i -> HTTP $codigo, la aplicacion respondio."
              exit 0
            fi
            if grep -q setTimeout respuesta.txt 2>/dev/null; then
              echo "intento $i -> el hosting devolvio su pagina anti-bots."
              reto=1
            else
              reto=0
              echo "intento $i -> HTTP $codigo, respuesta inesperada:"
              head -c 200 respuesta.txt 2>/dev/null || echo "(sin cuerpo)"
              echo
            fi
            sleep 6
          done
          # Que el hosting nos bloquee no dice nada sobre la aplicacion. Se
          # avisa sin marcar el despliegue en rojo: un rojo en cada despliegue
          # ensena a ignorarlos, y entonces el chequeo deja de servir el dia
          # que falle de verdad.
          if [ "$reto" = "1" ]; then
            echo "::warning::No se pudo verificar desde GitHub: el hosting bloquea sus IP con una pagina anti-bots. El compilado se subio y la aplicacion se reinicio; conviene abrir el sistema para confirmar."
            exit 0
          fi
          echo "::error::La aplicacion no confirmo estar en linea. Arriba queda que respondio en su lugar."
          exit 1
