# Recuperacion manual del backend en cPanel.
#
# El servidor NO puede compilar: 'prisma generate' usa un motor WebAssembly que
# su contenedor no consigue instanciar, y 'nest build' necesita las
# dependencias de desarrollo, que no se instalan en modo produccion. Por eso
# todo se construye aqui y se sube ya compilado.
#
# La transferencia va por SFTP y no por rsync porque el hosting tiene el shell
# deshabilitado: solo permite transferencia de archivos.
name: Recuperar backend en cPanel

# Se conserva unicamente como recuperacion manual. Produccion ahora se publica
# en Railway y no debe volver a iniciar Passenger en cPanel con cada push.
on:
  workflow_dispatch:

env:
  SERVIDOR: 192.250.227.20
  USUARIO: unirfoma
  RAIZ: /home/unirfoma/uniforma-api

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        # generate no se conecta a la base; la URL solo satisface al esquema.
        env:
          DATABASE_URL: mysql://u:p@localhost:3306/d
        run: npx prisma generate

      - name: Compilar
        run: npm run build

      - name: Preparar metadatos del despliegue
        run: |
          VERSION_APP=$(node -p "require('./package.json').version")
          cat > version.json <<EOF
          {
            "version": "$VERSION_APP",
            "commit": "$GITHUB_SHA",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deploymentRun": "$GITHUB_RUN_ID"
          }
          EOF

      - name: Preparar acceso SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          ssh-keyscan -H "$SERVIDOR" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Avisar si cambiaron las dependencias
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -q '^package.json$'; then
            echo "::warning::package.json cambio. El servidor conserva su propia version (alias de puppeteer, postinstall adaptado), asi que las dependencias nuevas NO se instalan solas: hay que ejecutar 'Ejecutar NPM Install' en cPanel."
          fi

      - name: Subir compilado
        run: |
          sftp -i ~/.ssh/id_despliegue -o BatchMode=yes "$USUARIO@$SERVIDOR" <<EOF
          cd $RAIZ
          put -r dist
          put -r prisma
          put -r scripts
          put version.json
          quit
          EOF

      - name: Subir cliente de Prisma
        # Se envia en cada despliegue. cPanel puede conservar o reinstalar una
        # copia anterior de node_modules y mezclar codigo nuevo con un cliente
        # generado desde un esquema viejo.
        run: |
          rm -f node_modules/.prisma/client/*.tmp* node_modules/.prisma/client/query_engine-windows.dll.node node_modules/.prisma/client/libquery_engine-debian-openssl-1.1.x.so.node
          sftp -i ~/.ssh/id_despliegue -o BatchMode=yes "$USUARIO@$SERVIDOR" <<EOF
          cd $RAIZ/node_modules/.prisma/client
          lcd node_modules/.prisma/client
          put *
          cd $RAIZ/node_modules/@prisma/client
          lcd ../../@prisma/client
          put -r *
          quit
          EOF

      - name: Reiniciar la aplicacion
        # Passenger recarga al tocar tmp/restart.txt.
        run: |
          # Se anota el instante previo: el acuse de arranque solo sirve como
          # prueba si es posterior a este reinicio. Si fuera anterior, seguiria
          # corriendo la instancia vieja.
          echo "MARCA_REINICIO=$(date -u +%s)" >> $GITHUB_ENV
          date > restart.txt
          sftp -i ~/.ssh/id_despliegue -o BatchMode=yes "$USUARIO@$SERVIDOR" <<EOF
          cd $RAIZ/tmp
          put restart.txt
          quit
          EOF

      # La aplicacion escribe arranque.json al levantar y aqui se baja por
      # SFTP. Es la unica via que queda: el hosting responde a las IP de
      # GitHub con una pagina anti-bots (HTTP 200, indistinguible de una
      # respuesta real mirando solo el codigo) y el SSH de la cuenta permite
      # transferir archivos pero no ejecutar comandos. Si la hora del acuse es
      # posterior al reinicio, el codigo nuevo levanto.
      - name: Comprobar que arranco
        run: |
          cat > lote.txt <<EOF
          cd $RAIZ
          get arranque.json
          quit
          EOF
          for i in $(seq 1 20); do
            rm -f arranque.json
            sftp -i ~/.ssh/id_despliegue -o BatchMode=yes -b lote.txt "$USUARIO@$SERVIDOR" > /dev/null 2>&1 || true
            if [ -f arranque.json ]; then
              arranco=$(python3 -c "import json,datetime; d=json.load(open('arranque.json')); print(int(datetime.datetime.fromisoformat(d['arrancoEn'].replace('Z','+00:00')).timestamp()))" 2>/dev/null || echo 0)
              if [ "$arranco" -gt "$MARCA_REINICIO" ]; then
                echo "intento $i -> la aplicacion arranco con el codigo nuevo."
                python3 -c "import json; d=json.load(open('arranque.json')); print('migraciones:', json.dumps(d.get('migrations', {}), ensure_ascii=False))"
                exit 0
              fi
              echo "intento $i -> el acuse es de un arranque anterior; sigue levantando."
            else
              echo "intento $i -> todavia no hay acuse de arranque."
            fi
            sleep 6
          done
          echo "::error::La aplicacion no dejo acuse de arranque tras el reinicio. Lo mas probable es que el codigo nuevo no levante: revisa stderr.log en el servidor."
          exit 1
